# nginx proxy address - http://172.17.0.1:64165

name: ergoirc
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: thelounge/thelounge:latest
    container_name: ergoirc-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: ergoirc-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '9000']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64165:9000'
    volumes:
      - './volumes/data/ergoirc:/var/opt/thelounge:z'
    depends_on:
      server:
        condition: service_healthy
    networks:
      - ergoirc

  server:
    image: ghcr.io/ergochat/ergo:latest
    container_name: ergoirc-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: ergoirc-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      ERGO__SERVER__LISTENERS: ':6667'
      ERGO__SERVER__NAME: ${BASE_DOMAIN_NAME:-example.com}
      ERGO__NETWORK__NAME: ${APP_ORG_NAME:-IRC}
    volumes:
      - './volumes/config/ergoirc:/ircd:z'
    healthcheck:
      test: ['CMD-SHELL', 'timeout 10s bash -c '':> /dev/tcp/127.0.0.1/6667'' || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - ergoirc

networks:
  ergoirc:
    name: ergoirc
    external: false
